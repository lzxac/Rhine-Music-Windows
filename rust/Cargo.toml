[package]
name = "rhine-desktop"
version = "0.0.0"
edition = "2021"
publish = false

# B2：只做渲染管线 + glb 载入 + 最简光照，不涉及曲库/音频/UI/打包。
[dependencies]
winit = "0.30"
wgpu = "0.20"
pollster = "0.3"
glam = "0.28"
gltf = "1.4"
bytemuck = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 2
